const enc = new TextEncoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const hex = u8 => [...u8].map(x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function userId(u){ return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(DATA.gs + ':' + u))).slice(0, 16)); }
async function kdf(secret, saltHex){
  const k = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt:unhex(saltHex), iterations:DATA.it }, k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function unlockKey(u, p){
  const e = DATA.users[await userId(u)];
  if(!e){ await kdf(u + ':' + p, DATA.gs); throw new Error('bad'); }   /* نفس الوقت تقريباً حتى لو اليوزر غلط */
  const kek = await kdf(u + ':' + p, e.s);
  return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(e.iv) }, kek, unb64(e.w)));
}
async function openSite(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(DATA.civ) }, key, unb64(DATA.ct));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), eEl = document.getElementById('e'), bEl = document.getElementById('b');
const SK = 'ds_k:' + DATA.vid;
(async () => { try{ const s = localStorage.getItem(SK); if(s) await openSite(unb64(s)); }catch(e){ try{ localStorage.removeItem(SK); }catch(_){} } })();
f.addEventListener('submit', async ev => {
  ev.preventDefault(); eEl.hidden = true; bEl.disabled = true; bEl.textContent = '...جاري التحقق';
  const u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
  try{
    const raw = await unlockKey(u, p);
    if(document.getElementById('r').checked){ try{ localStorage.setItem(SK, b64(raw)); }catch(_){} }
    await openSite(raw);
  }catch(err){
    eEl.textContent = 'اسم المستخدم أو كلمة المرور غلط'; eEl.hidden = false;
    bEl.disabled = false; bEl.textContent = 'دخول';
  }
});
